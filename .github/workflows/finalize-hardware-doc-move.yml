name: Finalize hardware docs move

on:
  push:
    paths:
      - '.github/workflows/finalize-hardware-doc-move.yml'

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update references and remove root copies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'HARDWARE_SPEC.md': 'hardware/HARDWARE_SPEC.md',
              'HARDWARE_BOM.md': 'hardware/HARDWARE_BOM.md',
              'HARDWARE_PACKING_LIST.md': 'hardware/HARDWARE_PACKING_LIST.md',
              'HARDWARE_*.md': 'hardware/HARDWARE_*.md',
          }

          for p in Path('.').rglob('*.md'):
              if '.git' in p.parts or (p.parts and p.parts[0] == 'hardware'):
                  continue
              text = p.read_text(encoding='utf-8')
              new = text
              for old, repl in replacements.items():
                  new = new.replace(old, repl)
              if new != text:
                  p.write_text(new, encoding='utf-8')
          PY

          git rm -f HARDWARE_SPEC.md HARDWARE_BOM.md HARDWARE_PACKING_LIST.md

          test -f hardware/HARDWARE_SPEC.md
          test -f hardware/HARDWARE_BOM.md
          test -f hardware/HARDWARE_PACKING_LIST.md
          test ! -e HARDWARE_SPEC.md
          test ! -e HARDWARE_BOM.md
          test ! -e HARDWARE_PACKING_LIST.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: organize hardware docs under hardware directory'
          git push

# temporary workflow; remove after success
