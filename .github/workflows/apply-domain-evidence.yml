- **실장비 디버깅:** mock/dummy 환경에서는 드러나지 않던 read timing, callback, parameter/payload 형식 문제를 실제 Raspberry Pi–Arduino 환경에서 수정했다.
'''
          replace_once('PREPLANNING.md', old, new)
          replace_once(
