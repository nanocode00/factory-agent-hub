name: Apply domain experience evidence

on:
  push:
    paths:
      - '.github/workflows/apply-domain-evidence.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply evidence-backed domain wording
        run: |
          python .github/scripts/patch-domain-evidence.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT2_ALIGNMENT.md REQUIREMENTS_CHECKLIST.md README.md
          git commit -m 'docs: align project docs with verified domain evidence'
          git push
