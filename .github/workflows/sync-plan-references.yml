name: Sync implementation plan references

on:
  push:
    paths:
      - '.github/workflows/sync-plan-references.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync README and project priorities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '| [`IMPLEMENTATION_PLAN.md`](./IMPLEMENTATION_PLAN.md) | 하드웨어/Edge 중심 상세 WBS |',
              '| [`IMPLEMENTATION_PLAN.md`](./IMPLEMENTATION_PLAN.md) | **Project2 전체 구현·배포·평가 통합 WBS / 실행 Gate** |'
          )
          old = '''## Immediate next steps

1. ~~기획 문서와 3개월 경험 근거 정리~~ → **완료: `PROJECT_PLAN.md`로 통합**
2. 9/17까지 개인 문제 후보 3개와 후보별 사용자/대안/평가 입력 10건을 준비한다.
3. Candidate A가 최종 선택되면 9/23까지 API/output/Skill/MCP/관측 계약과 30건 평가셋을 freeze한다.
4. 하드웨어 수령 후 각 장비를 Agent 없이 단독 bring-up한다.
5. 동시에 Vercel / FastAPI / Docker / Langfuse skeleton을 만든다.
6. Cloud Run ↔ Raspberry Pi edge 연결을 작은 smoke로 먼저 검증한다.
7. 실패 observation을 근거로 Prompt v1→v2를 바꾸고 같은 Dataset을 재측정한다.
8. 10/8 자정에 코드 동결하고 10/9~11은 발표 자료만 만든다.'''
          new = '''## Immediate next steps

1. ~~기획 문서와 3개월 경험 근거 정리~~ → **완료: `PROJECT_PLAN.md`로 통합**
2. 최근 Device Integration 반복 사례 / 현재 대안과 customer journey를 보강한다.
3. 대표 eval 10건의 expected result / rubric을 구체화하고 9/23까지 30건 Dataset으로 확장한다.
4. API / Pydantic output / failure / Skill / MCP / observability contract를 9/23까지 freeze한다.
5. 하드웨어 주문·수령 준비와 repo skeleton / 역할 분담을 끝낸다.
6. 9/28부터 Vercel / FastAPI / Docker / Langfuse / MCP와 hardware bring-up을 병렬 진행한다.
7. 10/6 baseline → 실패 분석 → 한 요소 변경 → 같은 Dataset 재측정을 수행한다.
8. 10/8 자정에 코드 동결하고 10/9~11은 발표 자료만 만든다.'''
          if old not in s:
              raise SystemExit('README Immediate next steps block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')

          p = Path('PROJECT_PLAN.md')
          s = p.read_text(encoding='utf-8')
          old = '''## 13. 현재 우선순위

1. 프로젝트 문서 중복 제거 및 source of truth 정리
2. 최근 실제 Device Integration Pain / 현재 대안 증거 보강
3. 30건 평가셋과 rubric 확정
4. 두 실제 장비 단독 bring-up
5. Serial protocol / DeviceSpec contract freeze
6. FastAPI / Docker / Vercel / Langfuse skeleton 구현
7. MCP + Edge 실제 통합
8. baseline 측정 → 실패 분석 → 개선 → 재측정'''
          new = '''## 13. 현재 우선순위

1. 최근 실제 Device Integration Pain / 현재 대안과 customer journey 증거 보강
2. 대표 eval 10건의 expected result / rubric 구체화 후 30건 Dataset으로 확장
3. API / Pydantic output / failure / Skill / MCP / observability contract freeze
4. 하드웨어 주문·수령 준비와 두 실제 장비 단독 bring-up
5. FastAPI / Docker / Vercel / Langfuse / FastMCP skeleton 구현
6. Serial protocol / DeviceSpec / Edge execution 통합
7. 두 모델 비교 + baseline 측정
8. 실패 분석 → 한 요소 개선 → 같은 Dataset 재측정 → release evidence 정리'''
          if old not in s:
              raise SystemExit('PROJECT_PLAN priority block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md PROJECT_PLAN.md
          git commit -m 'docs: sync current implementation priorities'
          git push

