name: Sync implementation plan references

on:
  push:
    paths:
      - '.github/workflows/sync-plan-references.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync README and project priorities
        run: |
          python .github/scripts/sync-plan-references.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md PROJECT_PLAN.md
          git commit -m 'docs: sync current implementation priorities'
          git push

# temporary workflow; delete after success
