name: Consolidate planning docs

on:
  push:
    paths:
      - '.github/workflows/consolidate-planning-docs.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply planning consolidation
        run: |
          python .github/scripts/consolidate-planning-docs.py
          if grep -R -n -E 'PROJECT2_ALIGNMENT\.md|PROJECT_PROPOSAL\.md|PREPLANNING\.md' README.md REQUIREMENTS_CHECKLIST.md IMPLEMENTATION_PLAN.md AGENTS.md PROJECT_PLAN.md; then
            echo 'stale planning reference remains' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md REQUIREMENTS_CHECKLIST.md IMPLEMENTATION_PLAN.md AGENTS.md PROJECT_PLAN.md
          git add -u PROJECT2_ALIGNMENT.md PROJECT_PROPOSAL.md PREPLANNING.md
          git commit -m 'docs: consolidate project planning into PROJECT_PLAN'
          git push
