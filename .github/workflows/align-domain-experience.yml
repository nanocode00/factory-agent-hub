name: Align domain experience wording

on:
  push:
    paths:
      - '.github/workflows/align-domain-experience.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update requirement alignment wording
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('PROJECT2_ALIGNMENT.md')
          s = p.read_text(encoding='utf-8')
          reps = [
          (
          '| 버티컬 도메인 | 소규모 연구실/장비 통합을 ICP 후보로 둠 | **팀원 중 최소 1명이 해당 사용자·업무 흐름·예외를 3개월 이상 직접 경험했음을 먼저 증명**. 불충족이면 최종 주제로 확정하지 않음 |',
          '| 버티컬 도메인 | 소규모 연구실/장비 통합을 ICP 후보로 둠 | 직접 경험 도메인을 **Embedded/IoT Device Integration**으로 좁힌다. Factory는 적용 시나리오이며 제조 현장 경험을 주장하지 않는다. 2024.03~2024.11 webOS 스마트 화분 프로젝트를 주 근거로 사용하고 산출물 링크를 보강한다. |'
          ),
          (
          '### 우선 도메인 정의 후보\n\n**문서화된 Serial 장비를 프로토타입/실험 환경에 연결하고, 명령·파라미터·상태 확인 규칙을 코드/문서에 옮겨 기존 흐름에 통합하는 작업**\n\n이 정의로 가려면 팀원별로 아래를 9/17 전에 적어야 한다.\n\n- 경험 기간\n- 실제로 다룬 장비/보드/프로젝트\n- 반복해서 했던 업무 단계\n- 자주 발생한 예외/실패\n- 현재 쓰는 우회 방법\n- 실제 산출물 예: 코드, commit, 노트, protocol 문서\n\n**3개월 경험을 구체적으로 설명할 팀원이 없다면 Factory Agent Hub는 최종 주제가 아니라 후보로만 남긴다.** 하드웨어를 샀다는 사실이나 Arduino를 다룰 수 있다는 사실은 이 조건을 대신하지 않는다.',
          '### 확정한 직접 경험 도메인\n\n**Embedded/IoT 프로토타이핑 환경에서 새 센서·액추에이터·Serial 장비를 기존 시스템에 연결하고, 데이터·명령·파라미터·상태 확인 규칙을 맞춰 통합하는 작업**\n\n주 경험 근거는 다음과 같다.\n\n- 경험자: 김재훈\n- 경험 기간: **2024.03~2024.11, 약 8개월**\n- 대표 프로젝트: **webOS 스마트 화분**\n- 실제 구성: Raspberry Pi, 센서, 급수 액추에이터, UI/소프트웨어 연동\n- 반복 업무: 장비 연결, 센서 데이터 규격 정리, 제어 로직 작성, HW-SW 통합 및 테스트\n- 반복 문제: 값/단위/전송 규칙 차이, 제어 조건 조율, 실제 HW-SW 인터페이스 연동\n- 남은 증빙: 실제 코드/문서/commit 링크와 대표 반복 사례 2~3개 정리\n\n`Factory`는 이 직접 경험을 과장하는 표현으로 사용하지 않는다. Conveyor와 Robot Arm은 **이미 경험한 Device Integration 문제를 재현·검증하는 physical testbed**로 둔다. 제조 공장 운영, PLC/SCADA 통합, 산업용 로봇 운영 경험은 본 프로젝트의 직접 경험 근거로 주장하지 않는다.'
          ),
          (
          '> **문서화된 Serial 장비를 반복적으로 프로토타입/실험 환경에 붙이는 통합 담당자가, 매번 명령·파라미터·상태 확인 규칙을 수동으로 구조화하고 기존 실행 흐름을 수정하는 반복 작업을 줄이기 위해, 자연어 장비 설명을 검증 가능한 DeviceSpec으로 만들고 승인된 기능만 기존 Agent가 재사용하도록 한다.**',
          '> **새 센서·액추에이터·Serial 장비를 프로토타입 시스템에 반복적으로 연결하는 개발자가, 장비마다 연결 방식·데이터·명령·파라미터·상태 확인 규칙을 다시 코드에 옮기고 통합해야 하는 반복 작업을 줄이기 위해, 자연어 장비 설명을 검증 가능한 DeviceSpec으로 만들고 승인된 기능만 기존 Agent가 재사용하도록 한다.**'
          )]
          for old, new in reps:
              if old not in s:
                  raise SystemExit('PROJECT2_ALIGNMENT replacement target not found:\n' + old[:160])
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('REQUIREMENTS_CHECKLIST.md')
          s = p.read_text(encoding='utf-8')
          reps = [
          (
          '| 팀원 중 해당 버티컬 도메인을 **3개월 이상 직접 경험**한 사람이 있어야 함 | `BLOCKED` | `PREPLANNING.md`에 Gate를 만들었으나 경험자/기간/실제 사례 칸이 비어 있음 | 경험자, 기간, 실제 프로젝트/장비, 반복 업무, 예외 상황, 코드·문서·commit 근거를 기록 |',
          '| 팀원 중 해당 버티컬 도메인을 **3개월 이상 직접 경험**한 사람이 있어야 함 | `PARTIAL` | 직접 경험 도메인을 **Embedded/IoT Device Integration**으로 좁혔고, `PREPLANNING.md`에 2024.03~2024.11 webOS 스마트 화분 프로젝트의 장비 통합 경험을 기록함 | 실제 코드/문서/commit 링크와 대표 반복 사례 2~3개를 붙여 증빙 완료 |'
          ),
          (
          '| 실제 사용자의 반복 업무를 해결하는 주제일 것 | `PARTIAL` | `PROJECT_PROPOSAL.md`에 ICP/JTBD와 반복 통합 가설이 있음 | 실제 경험 근거로 사용자와 업무 흐름을 확정 |',
          '| 실제 사용자의 반복 업무를 해결하는 주제일 것 | `PARTIAL` | 직접 경험한 새 센서·액추에이터·장비의 HW-SW 통합 반복 업무로 문제 범위를 좁힘 | 스마트 화분 경험의 구체 사례와 현재 대안을 2~3개 사례로 보강 |'
          ),
          (
          '**판정:** 현재 가장 큰 선행조건은 기술이 아니라 **3개월 직접 경험 Gate**다. 이 Gate를 못 닫으면 Factory Agent Hub를 최종 주제로 확정하지 않는다.',
          '**판정:** Candidate A의 3개월 기간 자체는 **Embedded/IoT Device Integration 경험으로 충족 가능**하다고 본다. 다만 평가자가 확인할 수 있도록 실제 코드/문서/commit 링크와 반복 사례를 붙이기 전까지는 `PARTIAL`로 유지한다. Factory Automation 실무 경험을 근거로 주장하지 않는다.'
          )]
          for old, new in reps:
              if old not in s:
                  raise SystemExit('REQUIREMENTS_CHECKLIST replacement target not found:\n' + old[:160])
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT2_ALIGNMENT.md REQUIREMENTS_CHECKLIST.md
          git commit -m 'docs: ground project2 domain in embedded IoT experience'
          git push
